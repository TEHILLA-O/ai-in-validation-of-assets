services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: valuationlab
      POSTGRES_PASSWORD: valuationlab
      POSTGRES_DB: valuationlab
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://valuationlab:valuationlab@db:5432/valuationlab
      VALUATIONLAB_SECRET: change-me
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      - db
  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
